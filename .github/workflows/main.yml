name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le zip le plus récent
        run: |
          ZIP=$(ls FileMaster-*.zip | sort -V | tail -1)
          echo "Zip utilisé : $ZIP"
          unzip -q "$ZIP" -d build_src
          ls build_src/FileMaster

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compiler l'APK debug
        working-directory: build_src/FileMaster
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FileMaster-debug-apk
          path: build_src/FileMaster/app/build/outputs/apk/debug/*.apk
